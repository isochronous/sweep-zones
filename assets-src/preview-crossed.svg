<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" font-family="Segoe UI, sans-serif">
  <defs>
    <!-- Broom drawn upright in 64-space (head at bottom), reused from the tool icon -->
    <g id="broomUp">
      <rect x="30.1" y="2" width="3.8" height="21" rx="1.9" fill="#e8e6e0" stroke="#262a30" stroke-width="1.1"/>
      <rect x="27.2" y="23" width="9.6" height="4.6" rx="1.6" fill="#e8e6e0" stroke="#262a30" stroke-width="1.1"/>
      <path fill="#c23b3f" stroke="#262a30" stroke-width="1.1" d="M26.5,27.6 L37.5,27.6 L42.5,44 L21.5,44 Z"/>
      <g stroke="#262a30" stroke-width="1.3" stroke-linecap="round">
        <line x1="29.4" y1="31.5" x2="27.8" y2="42.5"/>
        <line x1="32" y1="31.5" x2="32" y2="42.5"/>
        <line x1="34.6" y1="31.5" x2="36.2" y2="42.5"/>
      </g>
    </g>

    <!-- Mop, upright in 64-space: shaft, collar, splayed strands in cool blue -->
    <g id="mopUp">
      <rect x="30.1" y="2" width="3.8" height="21" rx="1.9" fill="#e8e6e0" stroke="#262a30" stroke-width="1.1"/>
      <rect x="27.6" y="23" width="8.8" height="4.2" rx="1.6" fill="#e8e6e0" stroke="#262a30" stroke-width="1.1"/>
      <g fill="#7fb4d6" stroke="#262a30" stroke-width="1.1">
        <rect x="22.6" y="26.5" width="4.4" height="17" rx="2.2" transform="rotate(9 24.8 27)"/>
        <rect x="27.4" y="27" width="4.4" height="18.5" rx="2.2" transform="rotate(4 29.6 27)"/>
        <rect x="32.2" y="27" width="4.4" height="18.5" rx="2.2" transform="rotate(-4 34.4 27)"/>
        <rect x="37" y="26.5" width="4.4" height="17" rx="2.2" transform="rotate(-9 39.2 27)"/>
      </g>
    </g>
  </defs>

  <rect x="0" y="0" width="300" height="300" fill="#8d8377"/>

  <!-- Card mock -->
  <rect x="22" y="22" width="256" height="256" rx="16" fill="#3a3a3e" stroke="#ffffff" stroke-width="3"/>
  <radialGradient id="bgGrad" cx="0.5" cy="0.42" r="0.75">
    <stop offset="0" stop-color="#4e4e52"/>
    <stop offset="1" stop-color="#28282b"/>
  </radialGradient>
  <rect x="24" y="24" width="252" height="252" rx="15" fill="url(#bgGrad)"/>

  <!-- Crossed implements: heads down-outward, handles up-outward, crossing mid-shaft -->
  <use href="#broomUp" transform="translate(150 138) rotate(35) scale(3.1) translate(-32 -24)"/>
  <use href="#mopUp"   transform="translate(150 138) rotate(-35) scale(3.1) translate(-32 -24)"/>

  <!-- Dashed zone floor under both -->
  <g stroke="#e8e6e0" stroke-width="7" stroke-linecap="round">
    <line x1="62"  y1="252" x2="82"  y2="252"/>
    <line x1="96"  y1="252" x2="116" y2="252"/>
    <line x1="130" y1="252" x2="150" y2="252"/>
    <line x1="164" y1="252" x2="184" y2="252"/>
    <line x1="198" y1="252" x2="218" y2="252"/>
  </g>

  <rect x="22" y="22" width="256" height="256" rx="16" fill="none" stroke="#ffffff" stroke-width="3"/>
</svg>
