<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 330" font-family="Segoe UI, sans-serif">
  <defs>
    <g id="buttonIdle">
      <rect x="-31" y="-31" width="62" height="62" rx="10" transform="rotate(45)" fill="#4a505c" stroke="#9aa0aa" stroke-width="2"/>
      <rect x="-26" y="-26" width="52" height="52" rx="8" transform="rotate(45)" fill="none" stroke="#3a3f49" stroke-width="1.5"/>
    </g>
    <g id="buttonActive">
      <rect x="-31" y="-31" width="62" height="62" rx="10" transform="rotate(45)" fill="#e9e6df" stroke="#f7f5ef" stroke-width="2"/>
      <rect x="-26" y="-26" width="52" height="52" rx="8" transform="rotate(45)" fill="none" stroke="#c9c5bb" stroke-width="1.5"/>
    </g>

    <!-- Final: two-tone push broom over dashed zone floor -->
    <g id="sweepZonesIcon">
      <g transform="rotate(35 32 30)">
        <rect x="30.1" y="6" width="3.8" height="17" rx="1.9" fill="#e8e6e0" stroke="#262a30" stroke-width="1.1"/>
        <rect x="27.2" y="23" width="9.6" height="4.6" rx="1.6" fill="#e8e6e0" stroke="#262a30" stroke-width="1.1"/>
        <path fill="#c23b3f" stroke="#262a30" stroke-width="1.1"
          d="M26.5,27.6 L37.5,27.6 L42.5,44 L21.5,44 Z"/>
        <g stroke="#262a30" stroke-width="1.3" stroke-linecap="round">
          <line x1="29.4" y1="31.5" x2="27.8" y2="42.5"/>
          <line x1="32" y1="31.5" x2="32" y2="42.5"/>
          <line x1="34.6" y1="31.5" x2="36.2" y2="42.5"/>
        </g>
      </g>
      <g stroke="#e8e6e0" stroke-width="2.8" stroke-linecap="round">
        <line x1="14" y1="50" x2="20" y2="50"/>
        <line x1="24" y1="50" x2="30" y2="50"/>
        <line x1="34" y1="50" x2="40" y2="50"/>
        <line x1="44" y1="50" x2="50" y2="50"/>
      </g>
    </g>
  </defs>

  <rect x="0" y="0" width="620" height="330" fill="#8d8377"/>
  <text x="20" y="28" fill="#f0ede6" font-size="15">Sweep Zones icon — refined F (solid head, dark bristle strokes, dashed zone floor)</text>

  <g>
    <use href="#buttonIdle" transform="translate(160 130) scale(2)"/>
    <use href="#sweepZonesIcon" transform="translate(96 66) scale(2)"/>
    <text x="160" y="235" fill="#f0ede6" font-size="14" text-anchor="middle">idle state, 2x</text>

    <use href="#buttonActive" transform="translate(440 130) scale(2)"/>
    <use href="#sweepZonesIcon" transform="translate(376 66) scale(2)"/>
    <text x="440" y="235" fill="#f0ede6" font-size="14" text-anchor="middle">active state, 2x</text>
  </g>

  <g>
    <use href="#buttonIdle" transform="translate(160 285)"/>
    <use href="#sweepZonesIcon" transform="translate(128 253)"/>
    <use href="#buttonActive" transform="translate(440 285)"/>
    <use href="#sweepZonesIcon" transform="translate(408 253)"/>
    <text x="30" y="290" fill="#f0ede6" font-size="12">actual size</text>
  </g>
</svg>
